<section class="luna-hero">
  <div
    id="lunaHeroCarousel"
    class="carousel slide carousel-fade"
    data-bs-ride="carousel"
    data-bs-interval="5000"
  >
    <div class="carousel-inner">
      @for (slide of slides; track slide.eyebrow; let i = $index) {
        <div class="carousel-item" [class.active]="i === 0">
          <div class="hero-slide">
            <div class="hero-image">
              <img [src]="slide.image" [alt]="slide.imageAlt" />
            </div>

            <div class="hero-content">
              <div class="hero-eyebrow" >
                <span>{{ slide.eyebrow }}</span>
                <span class="hero-eyebrow__line"></span>
              </div>

              <h1>{{ slide.title }}</h1>

              <p>{{ slide.description }}</p>

              <a href="#" class="hero-button">
                {{ slide.buttonText }}
                <i class="fa-solid fa-arrow-right"></i>
              </a>
            </div>
          </div>
        </div>
      }
    </div>

    <div class="hero-controls">
      <button
        class="hero-arrow"
        type="button"
        data-bs-target="#lunaHeroCarousel"
        data-bs-slide="prev"
        aria-label="Previous slide"
      >
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <button
        class="hero-arrow"
        type="button"
        data-bs-target="#lunaHeroCarousel"
        data-bs-slide="next"
        aria-label="Next slide"
      >
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <span class="hero-counter">
        <!-- {{ '0' + (activeIndex + 1) }} /
        {{ '0' + slides.length }} -->
      </span>
    </div>
  </div>
</section>

<section class="feature-strip-wrapper py-4">
  <div class="container">
    <div class="row g-4 justify-content-between">
      @for (item of feature; track item.title) {
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="d-flex align-items-center justify-content-lg-center gap-3">
          
            <div class="feature-icon flex-shrink-0">
              <i [class]="item.icon"></i>
            </div>
      
            <div>
              <h6 class="feature-title mb-0">{{ item.title }}</h6>
              <p class="feature-subtitle mb-0">{{ item.subtitle }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
