<section class="scent-section py-5">
  <div class="container">
    <div class="row align-items-center g-4">
      

      <div class="col-12 col-lg-3 pe-lg-4">
        <span class="eyebrow-text d-block mb-2">DISCOVER YOUR PERFECT SCENT</span>
        <h2 class="section-heading mb-3">The right fragrance for every mood</h2>
        <p class="section-desc mb-4">
          From calming nights to fresh mornings, find the scent that matches your moment.
        </p>
        
        <hr class="short-divider mb-3">
        
        <a href="javascript:void(0)" class="explore-link">
          Explore All Scents <i class="fa-solid fa-arrow-right ms-1"></i>
        </a>
      </div>

      <div class="col-12 col-lg-9">
        <div class="row g-3">
          @for (mood of moods; track mood.title) {
            <div class="col-12 col-md-4">
              <a href="javascript:void(0)" class="mood-card d-block position-relative overflow-hidden rounded-3 text-decoration-none" >
               
                <img [src]="mood.imageUrl" [alt]="mood.title" class="mood-img w-100 h-100 object-fit-cover">
                
          
                <div class="mood-overlay position-absolute bottom-0 start-0 w-100 p-4 d-flex flex-column justify-content-end">
                  <h4 class="card-title text-white mb-1">{{ mood.title }}</h4>
                  <p class="card-desc text-white-50 mb-3">{{ mood.description }}</p>
                  <span class="card-cta text-white">
                    {{ mood.linkText }} <i class="fa-solid fa-arrow-right ms-1"></i>
                  </span>
                </div>
              </a>
            </div>
          }
        </div>
      </div>

    </div>
  </div>
</section>
